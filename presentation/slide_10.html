<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background-color: #030712;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .slide {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 80% 20%, rgba(14, 165, 233, 0.12) 0%, transparent 40%),
                  radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 45%),
                  linear-gradient(135deg, #060C17 0%, #030712 100%);
      padding: 70px 90px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 30px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38BDF8;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38BDF8;
      box-shadow: 0 0 10px #38BDF8;
    }
    .univ-tag {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #94A3B8;
      letter-spacing: 1px;
    }

    .slide-body {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin: 25px 0;
    }

    .slide-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 50px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -1px;
      line-height: 1.15;
      margin-bottom: 10px;
    }
    .slide-title em {
      font-style: normal;
      background: linear-gradient(135deg, #38BDF8 0%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .slide-subtitle {
      font-size: 20px;
      color: #94A3B8;
      max-width: 950px;
      line-height: 1.6;
    }

    .slide-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      z-index: 10;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 20px;
      font-size: 14px;
      color: #64748B;
    }
    .footer-left {
      font-weight: 600;
      color: #94A3B8;
    }
    .footer-right {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      color: #38BDF8;
    }

    .glass-card {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 30px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      position: relative;
    }
    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.4), transparent);
    }

    .browser-frame {
      background: #0B132B;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(56, 189, 248, 0.15);
    }
    .browser-header {
      background: #0F172A;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .browser-dots {
      display: flex;
      gap: 8px;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #EF4444; }
    .dot-yellow { background: #F59E0B; }
    .dot-green { background: #10B981; }
    .browser-url {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 4px 16px;
      font-size: 13px;
      color: #94A3B8;
      flex: 1;
      font-family: monospace;
      text-align: center;
    }
    .browser-content img {
      width: 100%;
      height: auto;
      display: block;
    }

    .tablet-frame {
      border: 8px solid #1E293B;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      background: #000;
    }
    .mobile-frame {
      border: 8px solid #1E293B;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      background: #000;
    }

    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38BDF8;
      margin-bottom: 18px;
    }
  </style>
</head>
<body>

  <div class="slide" style="justify-content: space-between; align-items: center; text-align: center;">
    <div class="slide-header" style="width: 100%;">
      <div class="badge"><span class="badge-dot"></span> B.Tech CSE Project Review</div>
      <div class="univ-tag">KL UNIVERSITY</div>
    </div>

    <!-- Center Content -->
    <div style="position: relative; z-index: 10; margin: auto 0;">
      <div class="browser-frame" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 880px; height: 400px; opacity: 0.12; pointer-events: none; z-index: -1;">
        <div class="browser-header">
          <div class="browser-dots"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
          <div class="browser-url">https://anithareddy.dev</div>
        </div>
        <div class="browser-content"><img src="desktop.png"></div>
      </div>

      <h1 style="font-family: 'Space Grotesk', sans-serif; font-size: 96px; font-weight: 800; color: #FFFFFF; letter-spacing: -2px; line-height: 1; margin-bottom: 16px;">
        THANK YOU
      </h1>

      <div style="font-size: 26px; color: #38BDF8; font-weight: 600; margin-bottom: 40px; letter-spacing: 1px;">
        Questions &amp; Discussion
      </div>

      <div class="glass-card" style="display: inline-block; padding: 24px 50px; background: rgba(15, 23, 42, 0.85); border-color: rgba(56, 189, 248, 0.3);">
        <div style="font-size: 24px; font-weight: 800; color: #FFF; margin-bottom: 6px;">Anitha Reddy Yerredla</div>
        <div style="font-size: 16px; font-weight: 600; color: #94A3B8;">B.Tech CSE | KL University</div>
      </div>
    </div>

    <div class="slide-footer" style="width: 100%;">
      <div class="footer-left">Personal Portfolio Website — B.Tech CSE Project Review</div>
      <div class="footer-right">10 / 10</div>
    </div>
  </div>

</body>
</html>
